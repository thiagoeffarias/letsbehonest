name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: |
          npm run typecheck -w @preco-real/ui
          npm run typecheck -w @preco-real/model
          npm run typecheck -w @preco-real/data-pipeline
          npm run typecheck -w @preco-real/web
      - name: Testes
        run: |
          npm test -w @preco-real/ui
          npm test -w @preco-real/model
          npm test -w @preco-real/data-pipeline
          npm test -w @preco-real/web
      - name: Build do site
        run: npm run web:build
