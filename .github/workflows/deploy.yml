name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes
        run: |
          npm test -w @preco-real/ui
          npm test -w @preco-real/model
          npm test -w @preco-real/data-pipeline
          npm test -w @preco-real/web
      - uses: actions/configure-pages@v5
      - name: Build
        env:
          # Variável de repositório BASE_PATH (ex.: "/" com domínio próprio); por defeito /<nome-do-repo>/
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: npm run web:build
      - name: Fallback de SPA e ficheiros do Pages
        run: |
          cp web/dist/index.html web/dist/404.html
          touch web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
